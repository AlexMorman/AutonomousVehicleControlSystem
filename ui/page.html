<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car UI</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1b1f24; --muted: #667080; --line: #dde1e6;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    --chip: #eef0f3; --video-bg: #0d0f12;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316; --panel: #1a1d21; --text: #e7e9ec; --muted: #9aa3ad; --line: #2b3036;
      --accent: #3b82f6; --accent-text: #ffffff; --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444;
      --chip: #23272c; --video-bg: #000000;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
           padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
          border-radius: 999px; background: var(--chip); font-size: 13px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px;
         max-width: 1200px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .video { position: relative; background: var(--video-bg); border-radius: 10px; overflow: hidden;
           aspect-ratio: 4 / 3; }
  .video img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .video .placeholder { position: absolute; inset: 0; display: flex; align-items: center;
                        justify-content: center; color: #9aa3ad; }
  .tag { position: absolute; padding: 5px 10px; border-radius: 6px; background: rgba(0,0,0,.6);
         color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
  #overlay { left: 10px; top: 10px; font-size: 16px; }
  #motors { left: 10px; bottom: 10px; font-size: 13px; font-weight: 500; }
  #rec-badge { right: 10px; top: 10px; font-size: 13px; background: #b91c1c; }

  .estop { width: 100%; padding: 16px; font-size: 20px; font-weight: 700; border: 0; border-radius: 10px;
           background: var(--bad); color: #fff; cursor: pointer; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line);
         border-radius: 8px; overflow: hidden; }
  .seg button { padding: 10px 0; border: 0; background: transparent; color: var(--text);
                font: inherit; font-weight: 600; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--accent-text); }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
  .muted { color: var(--muted); font-size: 13px; }
  label.switch { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  label.switch input { width: 18px; height: 18px; accent-color: var(--accent); }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 240px; margin: 14px auto 0; }
  .pad button { aspect-ratio: 1.4; font-size: 22px; border-radius: 10px; border: 1px solid var(--line);
                background: var(--chip); color: var(--text); cursor: pointer; touch-action: none;
                user-select: none; -webkit-user-select: none; }
  .pad button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  input[type=text], input[type=number] {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; }
  input[type=number] { width: 64px; }
  .btn { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip);
         color: var(--text); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.rec { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  .btns .btn { flex: 1; }
  .msg { font-size: 13px; margin-top: 8px; color: var(--muted); word-break: break-all; }
  .msg:empty { display: none; }
  .msg.err { color: var(--bad); }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .thumbs:empty { display: none; }
  .thumbs a { display: block; aspect-ratio: 4/3; background: var(--video-bg); border-radius: 6px; overflow: hidden; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }

  @media (max-width: 860px) {
    /* Phone: one column, in the order you need while driving. */
    main { grid-template-columns: minmax(0, 1fr); }
    .col { display: contents; }
    .o1 { order: 1; } .o2 { order: 2; } .o3 { order: 3; } .o4 { order: 4; }
  }
</style>
</head>
<body>

<header>
  <h1>Car UI</h1>
  <span class="chip"><span class="dot" id="car-dot"></span><span id="car-text">Car: waiting</span></span>
  <span class="chip"><span class="dot" id="srv-dot"></span><span id="srv-text">AI</span></span>
  <span class="chip" id="fps" hidden></span>
</header>

<main>
  <div class="col">
    <div class="video o1">
      <img id="stream" alt="Live camera view">
      <div class="placeholder" id="placeholder">Waiting for the car…</div>
      <div class="tag" id="overlay" hidden></div>
      <div class="tag" id="motors" hidden></div>
      <div class="tag" id="rec-badge" hidden></div>
    </div>

    <div class="panel o4">
      <input type="text" id="name" placeholder="Name (optional)" maxlength="60">
      <div class="btns">
        <button class="btn primary" id="snap" title="P">📷 Take picture</button>
        <button class="btn" id="rec">● Record</button>
      </div>
      <div class="msg" id="save-msg"></div>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </div>

  <div class="col">
    <button class="estop o2" id="estop" title="Space">STOP</button>

    <div class="panel o3">
      <div class="seg" id="modes">
        <button data-mode="auto">Auto</button>
        <button data-mode="manual">Manual</button>
      </div>

      <!-- Auto: the AI drives -->
      <div id="auto-ui" hidden>
        <div class="row" id="stop-row" hidden>
          <span>Stop at sign ≥</span>
          <span><input type="number" id="stop-px" min="5" max="240" step="1"> px
            ≈ <input type="number" id="stop-in" min="5" max="200" step="1"> in</span>
        </div>
      </div>

      <!-- Manual: you drive -->
      <div id="manual-ui" hidden>
        <div class="row">
          <label class="switch"><input type="checkbox" id="ai"> AI prediction</label>
        </div>
        <div class="pad" id="pad">
          <span></span><button data-dir="fwd" title="W / ↑">▲</button><span></span>
          <button data-dir="left" title="A / ←">◀</button>
          <button data-dir="stop" title="Stop">■</button>
          <button data-dir="right" title="D / →">▶</button>
          <span></span><button data-dir="back" title="S / ↓">▼</button><span></span>
        </div>
        <div class="row">
          <span>Speed</span>
          <input type="range" id="speed" min="10" max="100" step="5" value="50">
          <span id="speed-val" class="muted">50%</span>
        </div>
        <div class="row">
          <span>Go straight</span>
          <span><input type="number" id="go-secs" min="0.5" max="30" step="0.5" value="2"> s</span>
          <button class="btn" id="go">Go</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const TURN_RATIO = 0.3;   // inner wheels' share of speed when turning while moving

let st = null;            // latest /api/state
const held = new Set();   // directions currently held: fwd, back, left, right
let goUntil = 0;          // "go straight" end time (ms)

async function post(path, body = {}) {
  const r = await fetch(path, {method: "POST", body: JSON.stringify(body),
    headers: {"Content-Type": "application/json"}});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
async function act(fn) { try { await fn(); } catch (e) { alert(e.message); } }
function stopDriving() { held.clear(); goUntil = 0; }

// ---------- live view ----------
const img = $("stream");
function startStream() { img.src = "/stream.mjpg?t=" + Date.now(); }
img.onerror = () => setTimeout(startStream, 1000);
startStream();

// ---------- status ----------
// inches ~= px_to_inches / px. The constant comes from server.py (sign_decider.PX_TO_INCHES).
const toInches = px => st && st.px_to_inches && px ? Math.round(st.px_to_inches / px) : null;
const fmt = v => typeof v === "number" ? (v >= 0 ? "+" : "") + v.toFixed(2) : "—";
function setDot(id, cls) { $(id).className = "dot " + (cls || ""); }

function render() {
  if (!st) return;
  const last = st.last || {};
  const live = !!st.car && st.frame_id > 0;

  setDot("car-dot", st.car ? "ok" : "");
  $("car-text").textContent = st.car ? "Car: connected" : "Car: waiting";
  $("fps").hidden = !st.car;
  $("fps").textContent = `${st.fps} fps`;
  if (!st.ai) { setDot("srv-dot", ""); $("srv-text").textContent = "AI off"; }
  else if (st.server_error) { setDot("srv-dot", "bad"); $("srv-text").textContent = "AI: server.py unreachable"; }
  else if (st.server_ok) {
    setDot("srv-dot", "ok");
    $("srv-text").textContent = last.model_ms != null ? `AI on · ${Math.round(last.model_ms)} ms` : "AI on";
  } else { setDot("srv-dot", "warn"); $("srv-text").textContent = "AI on"; }
  $("srv-text").title = st.server_error || "";

  $("placeholder").hidden = live;
  img.style.visibility = st.car ? "visible" : "hidden";

  // Prediction on the video, with the sign's size when the server reports it.
  const pred = live && st.ai && last.ai;
  $("overlay").hidden = !pred;
  if (pred) {
    let text = last.label ? `${last.label} ${(last.score ?? 0).toFixed(2)}` : "no sign";
    if (last.label && last.box_px) text += ` · ${last.box_px} px` + (toInches(last.box_px) ? ` ≈ ${toInches(last.box_px)} in` : "");
    $("overlay").textContent = text;
  }
  const m = last.sent_motors;
  $("motors").hidden = !(live && m);
  if (m) $("motors").textContent =
    `FL ${fmt(m.front_left)}  FR ${fmt(m.front_right)}  RL ${fmt(m.rear_left)}  RR ${fmt(m.rear_right)}`;

  // Only the controls for the current mode.
  for (const b of document.querySelectorAll("#modes button")) b.classList.toggle("on", b.dataset.mode === st.mode);
  $("auto-ui").hidden = st.mode !== "auto";
  $("manual-ui").hidden = st.mode !== "manual";
  if (document.activeElement !== $("ai")) $("ai").checked = st.ai;
  $("stop-row").hidden = !st.stop_size_px;
  if (st.stop_size_px) {  // unknown until server.py's first answer (its config value) or a change here
    if (document.activeElement !== $("stop-px")) $("stop-px").value = st.stop_size_px;
    if (document.activeElement !== $("stop-in")) $("stop-in").value = toInches(st.stop_size_px) ?? "";
  }

  const rec = st.recording;
  $("rec-badge").hidden = !rec;
  if (rec) $("rec-badge").textContent = `● REC ${rec.seconds}s`;
  $("rec").textContent = rec ? "■ Stop recording" : "● Record";
  $("rec").className = "btn" + (rec ? " rec" : "");
}

async function poll() {
  try { st = await (await fetch("/api/state")).json(); render(); } catch (e) {}
  setTimeout(poll, 200);
}
poll();

// ---------- mode and settings ----------
$("estop").onclick = () => { stopDriving(); act(() => post("/api/stop")); };
for (const b of document.querySelectorAll("#modes button"))
  b.onclick = () => { stopDriving(); act(() => post("/api/mode", {mode: b.dataset.mode})); };
$("ai").onchange = (e) => act(() => post("/api/ai", {enabled: e.target.checked}));
$("stop-px").onchange = () => act(() => post("/api/stop_size", {px: +$("stop-px").value}));
// Typing inches sets px (px = px_to_inches / inches); the car itself only uses px.
$("stop-in").onchange = () => {
  const inch = +$("stop-in").value;
  if (inch > 0 && st && st.px_to_inches) act(() => post("/api/stop_size", {px: Math.round(st.px_to_inches / inch)}));
};

// ---------- manual driving ----------
$("speed").oninput = () => { $("speed-val").textContent = $("speed").value + "%"; };

function manualMotors() {
  const s = Number($("speed").value) / 100;
  let t = (held.has("fwd") ? 1 : 0) - (held.has("back") ? 1 : 0);
  const r = (held.has("right") ? 1 : 0) - (held.has("left") ? 1 : 0);
  if (Date.now() < goUntil) t = 1;
  let left = 0, right = 0;
  if (t !== 0) {
    left = right = t * s;
    if (r > 0) right *= TURN_RATIO;
    if (r < 0) left *= TURN_RATIO;
  } else if (r !== 0) {          // spin on the spot
    left = r * s; right = -r * s;
  }
  return {front_left: left, rear_left: left, front_right: right, rear_right: right};
}

// Heartbeat: in Manual, send the current command 10 times a second (zeros when
// nothing is pressed). If these stop arriving, car_ui.py stops the car.
let sending = false;
setInterval(async () => {
  for (const b of document.querySelectorAll("#pad button"))
    b.classList.toggle("active", held.has(b.dataset.dir) || (b.dataset.dir === "fwd" && Date.now() < goUntil));
  if (!st || st.mode !== "manual" || sending || document.hidden) return;
  sending = true;
  try { await post("/api/manual", {motors: manualMotors()}); } catch (e) {} finally { sending = false; }
}, 100);

for (const b of document.querySelectorAll("#pad button")) {
  const dir = b.dataset.dir;
  if (dir === "stop") { b.onclick = stopDriving; continue; }
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); held.add(dir); });
  const release = () => held.delete(dir);
  b.addEventListener("pointerup", release);
  b.addEventListener("pointercancel", release);
  b.addEventListener("lostpointercapture", release);
}
$("go").onclick = () => { goUntil = Date.now() + Number($("go-secs").value || 0) * 1000; };

const KEYS = {ArrowUp: "fwd", KeyW: "fwd", ArrowDown: "back", KeyS: "back",
              ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right"};
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.target.type !== "checkbox" && e.target.type !== "range") return;
  if (e.code === "Space") { e.preventDefault(); $("estop").click(); return; }
  if (e.code === "KeyP") { e.preventDefault(); $("snap").click(); return; }
  if (KEYS[e.code] && st && st.mode === "manual") { e.preventDefault(); held.add(KEYS[e.code]); }
});
document.addEventListener("keyup", (e) => { if (KEYS[e.code]) held.delete(KEYS[e.code]); });
window.addEventListener("blur", () => held.clear());
document.addEventListener("visibilitychange", () => { if (document.hidden) stopDriving(); });

// ---------- pictures and recording ----------
function saveMsg(text, err) { $("save-msg").textContent = text; $("save-msg").className = "msg" + (err ? " err" : ""); }

async function loadThumbs() {
  try {
    const files = await (await fetch("/api/snapshots")).json();
    $("thumbs").innerHTML = "";
    for (const f of files.slice(0, 8)) {
      const a = document.createElement("a");
      a.href = "/files/" + encodeURI(f); a.target = "_blank"; a.title = f.split("/").pop();
      const i = document.createElement("img"); i.src = a.href; i.loading = "lazy"; i.alt = a.title;
      a.appendChild(i); $("thumbs").appendChild(a);
    }
  } catch (e) {}
}
loadThumbs();

$("snap").onclick = async () => {
  try { const r = await post("/api/snapshot", {name: $("name").value}); saveMsg("Saved " + r.file.split("/").pop()); loadThumbs(); }
  catch (e) { saveMsg(e.message, true); }
};
$("rec").onclick = async () => {
  try {
    if (st && st.recording) { const r = await post("/api/record", {action: "stop"}); saveMsg(`Saved ${r.frames} frames: ${r.dir.split("/").pop()}`); }
    else { await post("/api/record", {action: "start", name: $("name").value}); saveMsg(""); }
  } catch (e) { saveMsg(e.message, true); }
};
</script>
</body>
</html>
